<style>

  #otSvg{display:block;width:100%;height:auto;min-width:620px;font-family:inherit}
  .ot-ring{fill:none;stroke:var(--border2);stroke-dasharray:3 6}
  .ot-sector{opacity:.07}
  .ot-l{fill:none;stroke-width:1.6;opacity:.55;transition:opacity .2s}
  .ot-l.ruta{stroke-dasharray:4 5;opacity:.35}
  .ot-flow{opacity:.9}
  .ot-n{cursor:pointer;transition:opacity .2s}
  .ot-n:focus{outline:none}
  .ot-n .bg{fill:#fff;stroke-width:2.5;transition:stroke-width .15s}
  .ot-n:hover .bg,.ot-n:focus-visible .bg{stroke-width:4}
  .ot-n.sel .bg{stroke-width:5}
  .ot-n.ruta .bg{fill:#f6f5f1;stroke-dasharray:5 4}
  .ot-n.ruta .ico{opacity:.55}
  .ot-n .ico{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ot-n .lb{font-size:17px;font-weight:700;fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .ot-n .ls{font-size:13.5px;fill:var(--text2);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .ot-n.ruta .lb{fill:var(--text2);font-weight:600}
  .ot-n .tb{fill:#E5484D}
  .ot-n .tt{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}

  .ot-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--text2);padding:8px 10px 6px}
  .ot-legend span{display:inline-flex;align-items:center;gap:5px}
  .eq-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .st-operando{background:var(--ok)}.st-piloto{background:var(--pil)}.st-siguiente{background:var(--sig)}.st-ruta{background:transparent;border:1.5px dashed #9b998f}.st-humano{background:var(--text)}.st-area{background:var(--text2)}

  .eq-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;position:sticky;top:12px;min-height:460px}
  .eq-crumb{font-size:11px;color:var(--text2);margin-bottom:12px}
  .eq-crumb a{color:var(--text2);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--text2)}
  .eq-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .eq-h .eq-ico{flex:none;width:46px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--border);display:flex;align-items:center;justify-content:center}
  .eq-h .eq-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .eq-h h3{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .eq-persona{font-size:12px;color:var(--text2);margin-top:3px}
  .eq-sup{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:12px 0 4px}
  .eq-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .eq-desc{font-size:13px;line-height:1.55;color:var(--text);margin:12px 0 4px}
  .eq-sec{font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
  .eq-per{font-weight:400;opacity:.7;text-transform:none}
  .eq-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .eq-kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .eq-kpi .kv{font-size:18px;font-weight:700}
  .eq-kpi .kl{font-size:10.5px;color:var(--text2);margin-bottom:3px}
  .eq-kpi.alerta .kv{color:#B23A38}
  .eq-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
  .eq-fact{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.45}
  .eq-fact b{display:block;font-size:9.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .eq-ok{color:#0F7A4E;font-weight:700}
  .eq-tags{display:flex;flex-wrap:wrap;gap:6px}
  .eq-tag{background:#fff;border:1px solid var(--border2);border-radius:6px;padding:4px 9px;font-size:11.5px}
  .eq-link{background:#fff;border:1px solid var(--border2);border-radius:20px;padding:4px 11px 4px 8px;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;color:var(--text)}
  .eq-link:hover{border-color:var(--text)}
  .eq-list{font-size:12.5px;line-height:1.6;padding-left:18px}
  .eq-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .eq-tasks{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF4F4;border:1px solid #F3C9C9;border-radius:10px;padding:10px 12px;margin-top:14px;font-size:12.5px}
  .eq-tasks button{background:var(--text);color:#fff;border:none;border-radius:8px;padding:7px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
  /* Bandeja de tareas */
  .ot-scrim{position:fixed;inset:0;background:rgba(20,20,18,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}

  .ot-open .ot-scrim{opacity:1;pointer-events:auto}
  .ot-open .ot-drawer{transform:none}
  .ot-dh{padding:18px 20px 12px;border-bottom:1px solid var(--border);background:#fff}
  .ot-dh h3{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ot-x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--text2);padding:4px 6px}
  .ot-who{font-size:12px;color:var(--text2);margin-top:2px}
  .ot-demo{margin-top:10px;font-size:11.5px;line-height:1.45;background:#FFF8E6;border:1px solid #F1DFAE;color:#7A5A12;border-radius:8px;padding:8px 10px}

  .tk-ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tk-b{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:7px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer;color:var(--text)}

  .tk-b.p:hover{background:#177A50}
  .tk-b.d{color:var(--text2)}
  .tk.done{opacity:.6}

  .tk-st{display:none;margin-top:8px;font-size:12px;font-weight:700}
  .tk.done .tk-st{display:block}
  .ot-empty{text-align:center;color:var(--text2);font-size:13px;padding:40px 10px}
  .ot-reset{background:none;border:none;color:var(--text2);text-decoration:underline;font-size:11px;cursor:pointer;font-family:inherit;margin-top:8px}
  .ot-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#1f1f1c;color:#fff;font-size:12.5px;line-height:1.4;padding:11px 16px;border-radius:10px;max-width:min(440px,92vw);opacity:0;transition:all .25s;z-index:70;pointer-events:none}
  .ot-toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:900px){ .ot-grid{grid-template-columns:1fr} .eq-panel{position:static;min-height:0} .eq-two{grid-template-columns:1fr} }
</style>

      'L' + f(CX + r0 * c(a1)) + ' ' + f(CY + r0 * s(a1)) + 'A' + r0 + ' ' + r0 + ' 0 ' + big + ' 0 ' + f(CX + r0 * c(a0)) + ' ' + f(CY + r0 * s(a0)) + 'Z';
  }
  function wrap(t, max) {
    var w = String(t).split(' '), out = [''], i;
    for (i = 0; i < w.length; i++) { var c = out[out.length - 1]; if (c && (c + ' ' + w[i]).length > max && out.length < 2) out.push(w[i]); else out[out.length - 1] = c ? c + ' ' + w[i] : w[i]; }
    return out;
  }
  var h = '<defs><filter id="otSh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter></defs>';
  areas.forEach(function (a) { h += '<path class="ot-sector" fill="' + AC[a.id] + '" d="' + arcPath(P[a.id].a0 + .02, P[a.id].a1 - .02, 96, 420) + '"/>'; });
  h += '<circle class="ot-ring" cx="' + CX + '" cy="' + CY + '" r="' + R1 + '"/><circle class="ot-ring" cx="' + CX + '" cy="' + CY + '" r="' + R2 + '"/>';
  var flows = '';
  function link(a, b, cls, d) { return '<path class="ot-l ' + cls + '" data-a="' + a + '" data-b="' + b + '" stroke="' + colorOf(N[b]) + '" d="' + d + '"/>'; }
  areas.forEach(function (a) {
    var A = P[a.id], dA = 'M' + f(CX) + ' ' + f(CY) + 'L' + f(A.x) + ' ' + f(A.y);
    h += link(root.id, a.id, '', dA);
    var act = kids(a.id).some(function (k) { return k.estado === 'operando' || k.estado === 'piloto'; });
    if (act) flows += '<circle class="ot-flow" data-a="' + root.id + '" data-b="' + a.id + '" r="4" fill="' + AC[a.id] + '"><animateMotion dur="2.6s" repeatCount="indefinite" path="M' + f(A.x) + ' ' + f(A.y) + 'L' + f(CX) + ' ' + f(CY) + '"/></circle>';
    kids(a.id).forEach(function (k, i) {
      var Q = P[k.id], mr = (R1 + R2) / 2, cx = CX + mr * Math.cos(Q.a), cy = CY + mr * Math.sin(Q.a);
      var d = 'M' + f(A.x) + ' ' + f(A.y) + 'Q' + f(cx) + ' ' + f(cy) + ' ' + f(Q.x) + ' ' + f(Q.y);
      h += link(a.id, k.id, k.estado === 'ruta' ? 'ruta' : '', d);
      if (k.estado === 'operando' || k.estado === 'piloto') {
        var back = 'M' + f(Q.x) + ' ' + f(Q.y) + 'Q' + f(cx) + ' ' + f(cy) + ' ' + f(A.x) + ' ' + f(A.y);
        flows += '<circle class="ot-flow" data-a="' + a.id + '" data-b="' + k.id + '" r="3.5" fill="' + SC[k.estado] + '"><animateMotion dur="' + (2.2 + i * .35).toFixed(2) + 's" repeatCount="indefinite" path="' + back + '"/></circle>';
      }
    });
  });
  h += flows;
  function node(n) {
    var Q = P[n.id], r = Q.r, col = n.tipo === 'agente' ? SC[n.estado] : colorOf(n), sc = r / 17;
    var g = '<g class="ot-n ' + (n.estado === 'ruta' ? 'ruta' : '') + '" data-id="' + n.id + '" tabindex="0" role="button" aria-label="' + esc(n.nombre) + '">';
    if (n.estado === 'operando' || n.estado === 'piloto') g += '<circle class="ot-pulse" cx="' + f(Q.x) + '" cy="' + f(Q.y) + '" r="' + r + '" stroke="' + col + '"/>';
    if (n.tipo !== 'agente') g += '<circle cx="' + f(Q.x) + '" cy="' + f(Q.y) + '" r="' + (r + 7) + '" fill="' + col + '" opacity=".12"/>';
    g += '<circle class="bg" cx="' + f(Q.x) + '" cy="' + f(Q.y) + '" r="' + r + '" stroke="' + col + '" filter="url(#otSh)"/>';
    g += '<g class="ico" stroke="' + (n.tipo === 'agente' ? '#2b2a27' : col) + '" transform="translate(' + f(Q.x - 12 * sc) + ' ' + f(Q.y - 12 * sc) + ') scale(' + f(sc) + ')">' + (ICON[n.icono] || '') + '</g>';
    var lines, sub, ly;
    if (n.tipo === 'agente') {
      lines = wrap(n.nombre, 14); sub = ESTADO[n.estado];
      var cs = Math.cos(Q.a), sn = Math.sin(Q.a), LH = 19, anc = 'middle', lx, base, tot = lines.length * LH + 16;
      if (cs > 0.42) { anc = 'start'; lx = Q.x + r + 12; base = Q.y - tot / 2 + 15; }
      else if (cs < -0.42) { anc = 'end'; lx = Q.x - r - 12; base = Q.y - tot / 2 + 15; }
      else if (sn < 0) { lx = Q.x; base = Q.y - r - 12 - tot + 15; }
      else { lx = Q.x; base = Q.y + r + 22; }
      var st = ' style="text-anchor:' + anc + '"';
      lines.forEach(function (t, i) { g += '<text class="lb"' + st + ' x="' + f(lx) + '" y="' + f(base + i * LH) + '">' + esc(t) + '</text>'; });
      g += '<text class="ls"' + st + ' x="' + f(lx) + '" y="' + f(base + lines.length * LH - 1) + '">' + esc(sub) + '</text>';
    } else {
      ly = Q.y + r + 26;
      g += '<text class="lb" x="' + f(Q.x) + '" y="' + f(ly) + '" style="font-size:' + (n.tipo === 'area' ? 17.5 : 19) + 'px">' + esc(n.nombre) + '</text>';
      sub = n.tipo === 'area' ? (n.supervisor ? 'Sup. ' + n.supervisor : '') : (n.persona || '') + (n.cargo ? ' · ' + n.cargo : '');
      g += '<text class="ls" x="' + f(Q.x) + '" y="' + f(ly + 18) + '">' + esc(sub) + '</text>';
    }
    g += '<g class="tbadge" data-ag="' + n.id + '"></g>';
    return g + '</g>';
  }
  h += node(root); areas.forEach(function (a) { h += node(a); }); posts.forEach(function (p) { h += node(p); });
  svgEl.innerHTML = h;

  function drawBadges() {
    svgEl.querySelectorAll('.tbadge').forEach(function (b) {
      var id = b.getAttribute('data-ag'), n = N[id], c = id === root.id ? pend() : n.tipo === 'area' ? kids(id).reduce(function (s, k) { return s + pend(k.id); }, 0) : pend(id);
      if (!c) { b.innerHTML = ''; return; }
      var Q = P[id], bx = Q.x + Q.r * .72, by = Q.y - Q.r * .72;
      b.innerHTML = '<circle class="tb" cx="' + f(bx) + '" cy="' + f(by) + '" r="11" stroke="#fff" stroke-width="2"/><text class="tt" x="' + f(bx) + '" y="' + f(by + 4) + '">' + c + '</text>';
    });
    var t = pend(); document.getElementById('otBadge').textContent = t ? t : '';
  }

  // Resaltar rama al pasar el mouse
  function family(id) {
    var s = {}; s[id] = 1; var n = N[id];
    while (n && n.padre) { s[n.padre] = 1; n = N[n.padre]; }
    kids(id).forEach(function (k) { s[k.id] = 1; kids(k.id).forEach(function (kk) { s[kk.id] = 1; }); });
    return s;
  }
  function hl(id) {
    if (!id) { svgEl.classList.remove('hl'); return; }
    var s = family(id); svgEl.classList.add('hl');
    svgEl.querySelectorAll('.ot-n').forEach(function (g) { g.classList.toggle('on', !!s[g.getAttribute('data-id')]); });
    svgEl.querySelectorAll('.ot-l,.ot-flow').forEach(function (l) { l.classList.toggle('on', !!(s[l.getAttribute('data-a')] && s[l.getAttribute('data-b')])); });
  }
  svgEl.addEventListener('mouseover', function (e) { var g = e.target.closest('.ot-n'); hl(g ? g.getAttribute('data-id') : null); });
  svgEl.addEventListener('mouseleave', function () { hl(null); });

  // ---------- Ficha del cargo ----------
  function chain(n) { var c = []; while (n) { c.unshift(n); n = N[n.padre]; } return c; }
  function links(ids) {
    ids = (ids || []).filter(function (i) { return N[i]; });
    if (!ids.length) return '<span class="eq-persona">—</span>';
    return '<div class="eq-tags">' + ids.map(function (i) { var x = N[i]; return '<button class="eq-link" data-go="' + i + '"><i class="eq-dot st-' + x.estado + '"></i>' + esc(x.nombre) + '</button>'; }).join('') + '</div>';
  }
  var COL = { 'fr:gasto': ['frBody', [1]], 'fr:resultados': ['frBody', [8]], 'fr:calificados': ['frBody', [10]], 'fr:costo_calif': ['frBody', [13]],
              'fe:total': ['feBody', [10]], 'fe:descartado': ['feBody', [9]], 'fe:derivados': ['feBody', [5, 6, 7]] };
  function vivo(src) {
    var c = COL[src], tb = c && document.getElementById(c[0]); if (!tb) return '—';
    var tr = tb.querySelector('tr.tot'); if (!tr) return '—';
    var td = tr.children;
    if (c[1].length === 1) return td[c[1][0]] ? td[c[1][0]].textContent.trim() : '—';
    var sum = 0; c[1].forEach(function (i) { sum += parseInt((td[i] ? td[i].textContent : '0').replace(/[^0-9]/g, ''), 10) || 0; });
    return sum.toLocaleString('es-CL');
  }
  function periodo() { var b = document.querySelector('.filter-btn.active'); return b ? b.textContent.trim() : 'período'; }
  var ini = function (s) { return String(s || '').split(' ').map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase(); };
  var cur;
  function render(id) {
    cur = id;
    var n = N[id]; if (!n) return;
    svgEl.querySelectorAll('.ot-n').forEach(function (g) { g.classList.toggle('sel', g.getAttribute('data-id') === id); });
    var col = colorOf(n);
    var o = '<div class="eq-crumb">' + chain(n).map(function (c, i, a) { return i < a.length - 1 ? '<a data-go="' + c.id + '">' + esc(c.nombre) + '</a> › ' : '<b>' + esc(c.nombre) + '</b>'; }).join('') + '</div>';
    o += '<div class="eq-h"><span class="eq-ico" style="border-color:' + (n.tipo === 'agente' ? SC[n.estado] : col) + ';color:' + (n.tipo === 'agente' ? '#2b2a27' : col) + '">' + svgI(n.icono) + '</span><div><h3>' + esc(n.nombre) + '</h3>' +
      '<div class="eq-persona">' + (n.persona ? esc(n.persona) + (n.cargo ? ' · ' + esc(n.cargo) : '') + ' · ' : '') + '<span class="eq-chip ch-' + n.estado + '">' + ESTADO[n.estado] + '</span>' + (n.plataforma ? ' · ' + esc(n.plataforma) : '') + '</div></div></div>';
    if (n.supervisor) o += '<div class="eq-sup"><span class="eq-av" style="background:' + col + '">' + esc(ini(n.supervisor)) + '</span><div><b style="font-size:13px">' + esc(n.supervisor) + '</b><div class="eq-persona" style="margin:0">Supervisa · ' + esc(n.supervisor_rol || '') + '</div></div></div>';
    o += '<div class="eq-desc">' + esc(n.descripcion) + '</div>';
    var nt = n.id === root.id ? pend() : n.tipo === 'area' ? kids(n.id).reduce(function (s, k) { return s + pend(k.id); }, 0) : pend(n.id);
    if (nt) o += '<div class="eq-tasks"><span><b>' + nt + '</b> tarea' + (nt > 1 ? 's' : '') + ' esperando tu aprobación</span><button type="button" data-tasks="' + (n.tipo === 'agente' ? n.id : '') + '">Ver tareas</button></div>';
    if (n.kpis && n.kpis.length) {
      o += '<div class="eq-sec">' + (n.estado === 'ruta' || n.estado === 'siguiente' ? 'Lo que movería' : 'KPIs críticos') + '</div><div class="eq-kpis">' +
        n.kpis.map(function (k) { var v = k.src ? vivo(k.src) : k.v; return '<div class="eq-kpi' + (k.alerta ? ' alerta' : '') + '"><div class="kl">' + esc(k.n) + (k.src ? ' <span class="eq-per">· ' + esc(periodo()) + '</span>' : '') + '</div><div class="kv">' + esc(v) + '</div></div>'; }).join('') + '</div>';
    }
    if (n.tipo === 'area') {
      o += '<div class="eq-sec">Cargos de la gerencia</div>' + links(kids(n.id).map(function (k) { return k.id; }));
      if (n.recibe && n.recibe.length) o += '<div class="eq-sec">El supervisor recibe</div><ul class="eq-list">' + n.recibe.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    } else if (n.tipo === 'humano') {
      o += '<div class="eq-sec">Gerencias a cargo</div>' + links(areas.map(function (a) { return a.id; }));
      if (n.recibe) o += '<div class="eq-sec">Recibe</div><ul class="eq-list">' + n.recibe.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    } else {
      o += '<div class="eq-sec">Operación</div><div class="eq-facts">';
      if (n.corre) o += '<div class="eq-fact"><b>Cuándo corre</b>' + esc(n.corre) + '</div>';
      if (n.ultima) o += '<div class="eq-fact"><b>Última corrida</b>' + esc(n.ultima) + ' · <span class="eq-ok">' + (n.resultado === 'ok' ? '✓ OK' : esc(n.resultado)) + '</span><br><span class="eq-persona">' + esc(n.resultado_txt || '') + '</span></div>';
      o += '</div>';
      if (n.herramientas) o += '<div class="eq-sec">Herramientas que necesita</div><div class="eq-tags">' + n.herramientas.map(function (t) { return '<span class="eq-tag">' + esc(t) + '</span>'; }).join('') + '</div>';
      if (n.insumos || n.entregables) {
        o += '<div class="eq-two"><div><div class="eq-sec">Trabaja con</div><ul class="eq-list">' + (n.insumos || ['—']).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>' +
          '<div><div class="eq-sec">Entrega</div><ul class="eq-list">' + (n.entregables || ['—']).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div></div>';
      }
      o += '<div class="eq-two"><div><div class="eq-sec">Depende de</div>' + links(n.depende) + '</div><div><div class="eq-sec">Alimenta a</div>' + links(n.alimenta) + '</div></div>';
    }
    var p = document.getElementById('eqPanel'); p.innerHTML = o;
    if (window.innerWidth < 900 && window.__eqTouched) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  svgEl.addEventListener('click', function (e) { var g = e.target.closest('.ot-n'); if (g) { window.__eqTouched = true; render(g.getAttribute('data-id')); } });
  svgEl.addEventListener('keydown', function (e) { var g = e.target.closest('.ot-n'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); window.__eqTouched = true; render(g.getAttribute('data-id')); } });
  document.getElementById('eqPanel').addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]'); if (t) { render(t.getAttribute('data-go')); return; }
    var k = e.target.closest('[data-tasks]'); if (k) openT(k.getAttribute('data-tasks') || '');
  });

  // ---------- Bandeja "Mis tareas" ----------
  var tab = document.getElementById('tab-equipo'), filt = '';
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var fecha = function (iso) { return iso ? parseInt(iso.slice(8, 10), 10) + ' ' + MES[parseInt(iso.slice(5, 7), 10) - 1] : ''; };
  var ags = []; T.forEach(function (t) { if (ags.indexOf(t.agente) < 0) ags.push(t.agente); });
  function card(t) {
    var a = N[t.agente] || {}, c = a.tipo === 'agente' ? SC[a.estado] : colorOf(a), s = ST[t.id];
    var o = '<div class="tk' + (s ? ' done' : '') + '" data-t="' + esc(t.id) + '" style="--c:' + c + '">';
    o += '<div class="tk-top"><span class="tk-ag">' + svgI(a.icono) + esc(a.nombre || t.agente) + '</span><span class="tk-pr ' + esc(t.prioridad) + '">' + (t.prioridad === 'alta' ? 'Prioridad alta' : 'Prioridad media') + '</span>' +
      '<span>Aprueba ' + esc(t.aprueba) + ' → ejecuta ' + esc(t.ejecuta) + '</span></div>';
    o += '<div class="tk-t">' + esc(t.titulo) + '</div>';
    if (t.lead) {
      o += '<div class="tk-lead"><b>' + esc(t.lead) + '</b><span class="tk-sc ' + esc(t.temperatura) + '" title="Score de compra">' + esc(t.score) + '</span><span class="tk-et">' + esc(t.etapa) + '</span>' +
        (t.ultimo ? '<span class="eq-persona" style="margin:0">Último mensaje del cliente: ' + fecha(t.ultimo) + (t.dias != null ? ' · hace ' + t.dias + ' día' + (t.dias === 1 ? '' : 's') : '') + '</span>' : '') + '</div>';
    }
    if (t.racional) o += '<div class="tk-r"><b>Por qué está aquí:</b> ' + esc(t.racional) + '</div>';
    if (t.senales && t.senales.length) o += '<div class="tk-sg">' + t.senales.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
    if (t.mensaje) o += '<div class="tk-msg"><b>Borrador sugerido · editable</b><div contenteditable="true" spellcheck="false">' + esc(t.mensaje) + '</div></div>';
    o += '<div class="tk-ac">' + (t.acciones || []).map(function (x, i) { var cl = i === 0 ? 'p' : (/descartar/i.test(x) ? 'd' : ''); return '<button type="button" class="tk-b ' + cl + '" data-act="' + i + '">' + esc(x) + '</button>'; }).join('') + '</div>';
    o += '<div class="tk-st">' + (s === 'descartada' ? '✕ Descartada' : '✓ Aprobada') + ' · demo <button type="button" class="ot-reset" data-undo="1">deshacer</button></div>';
    return o + '</div>';
  }
  function drawT() {
    var list = T.filter(function (t) { return !filt || t.agente === filt; });
    list.sort(function (a, b) { return (ST[a.id] ? 1 : 0) - (ST[b.id] ? 1 : 0) || (a.prioridad === 'alta' ? 0 : 1) - (b.prioridad === 'alta' ? 0 : 1); });
    document.getElementById('otList').innerHTML = list.length ? list.map(card).join('') + '<div style="text-align:center"><button type="button" class="ot-reset" id="otReset">Reiniciar demo</button></div>' : '<div class="ot-empty">No hay tareas pendientes.</div>';
    var ap = 0, ds = 0; T.forEach(function (t) { if (ST[t.id] === 'aprobada') ap++; if (ST[t.id] === 'descartada') ds++; });
    document.getElementById('otStats').innerHTML = '<div class="ot-stat"><b>' + pend() + '</b><span>Pendientes</span></div><div class="ot-stat"><b>' + ap + '</b><span>Aprobadas</span></div><div class="ot-stat"><b>' + ds + '</b><span>Descartadas</span></div>';
    document.getElementById('otFilt').innerHTML = '<button type="button" class="ot-f' + (filt ? '' : ' on') + '" data-f="">Todas (' + T.length + ')</button>' +
      ags.map(function (g) { var n = T.filter(function (t) { return t.agente === g; }).length; return '<button type="button" class="ot-f' + (filt === g ? ' on' : '') + '" data-f="' + g + '">' + esc((N[g] || {}).nombre || g) + ' (' + n + ')</button>'; }).join('');
    drawBadges();
  }
  var root0 = N[root.id];
  document.getElementById('otWho').textContent = (root0.persona || '') + ' · ' + (root0.cargo || root0.nombre) + ' — acciones que los agentes te proponen hoy';
  function openT(ag) { filt = ag || ''; drawT(); tab.classList.add('ot-open'); document.getElementById('otDrawer').setAttribute('aria-hidden', 'false'); }
  function closeT() { tab.classList.remove('ot-open'); document.getElementById('otDrawer').setAttribute('aria-hidden', 'true'); if (cur) render(cur); }
  var toastT;
  function toast(m) { var el = document.getElementById('otToast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 3600); }
  document.getElementById('otOpen').addEventListener('click', function () { openT(''); });
  document.getElementById('otClose').addEventListener('click', closeT);
  document.getElementById('otScrim').addEventListener('click', closeT);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && tab.classList.contains('ot-open')) closeT(); });
  document.getElementById('otDrawer').addEventListener('click', function (e) {
    var fb = e.target.closest('[data-f]'); if (fb) { filt = fb.getAttribute('data-f'); drawT(); return; }
    if (e.target.id === 'otReset') { ST = {}; save(); drawT(); toast('Demo reiniciada.'); return; }
    var card = e.target.closest('.tk'); if (!card) return;
    var t = T.filter(function (x) { return x.id === card.getAttribute('data-t'); })[0]; if (!t) return;
    if (e.target.closest('[data-undo]')) { delete ST[t.id]; save(); drawT(); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var lbl = b.textContent;
    if (/performance/i.test(lbl)) { var tb = document.querySelector('#tabBar [data-tab="performance"]'); closeT(); if (tb) tb.click(); return; }
    if (/descartar/i.test(lbl)) { ST[t.id] = 'descartada'; save(); drawT(); toast('Tarea descartada. En producción, el agente aprende de este descarte.'); return; }
    ST[t.id] = 'aprobada'; save(); drawT();
    toast(/whatsapp/i.test(lbl) ? 'Demo: en producción esto abre WhatsApp de ' + (t.ejecuta || 'la ejecutiva') + ' con el mensaje listo y deja registro en GHL.'
      : /mover|etapa/i.test(lbl) ? 'Demo: en producción esto mueve la oportunidad de etapa en GHL.' : 'Demo: acción registrada. En producción se ejecutaría en el sistema correspondiente.');
  });

  // ---------- Inicio ----------
  var activos = D.nodos.filter(function (n) { return n.estado === 'operando' || n.estado === 'piloto'; }).length;
  var agentes = D.nodos.filter(function (n) { return n.tipo === 'agente'; }).length;
  document.getElementById('eqSub').textContent = activos + ' agentes activos de ' + agentes + ' planificados · ' + areas.length + ' gerencias · toca un círculo para ver la ficha del cargo';
  drawBadges();
  render(root.id);
  var scr = document.querySelector('#tab-equipo .ot-scroll');
  var centrar = function () { if (scr && scr.scrollWidth > scr.clientWidth) scr.scrollLeft = (scr.scrollWidth - scr.clientWidth) / 2; };
  document.addEventListener('tabshow', function (e) { if (e.detail === 'equipo') setTimeout(centrar, 0); });
  setTimeout(centrar, 0);
  document.addEventListener('tabshow', function (e) { if (e.detail === 'equipo') render(cur); else if (tab.classList.contains('ot-open')) closeT(); });
})();
</script>
